<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>解答カメラ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="解答カメラ">
<meta name="theme-color" content="#1c1c1e">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #1c1c1e; color: #f2f2f7;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
  body { padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  .screen { display: none; height: 100%; flex-direction: column; }
  .screen.on { display: flex; }

  /* 撮影画面 */
  #home { align-items: center; justify-content: center; gap: 28px; }
  #shoot { width: 200px; height: 200px; border-radius: 50%; border: 0;
    background: #0a84ff; color: #fff; font-size: 22px; font-weight: 700;
    box-shadow: 0 8px 30px rgba(10,132,255,.35); }
  #shoot:active { transform: scale(.96); }
  #shoot svg { display: block; margin: 0 auto 8px; }
  #gear { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 16px;
    background: none; border: 0; color: #8e8e93; font-size: 15px; padding: 8px; }

  /* 解答画面 */
  #result { padding-top: 12px; }
  #thumb { width: 100%; max-height: 22vh; object-fit: contain; border-radius: 12px;
    background: #000; flex: none; }
  #answer { flex: 1; overflow-y: auto; margin: 14px 0; padding: 16px; border-radius: 14px;
    background: #2c2c2e; font-size: 17px; line-height: 1.7; white-space: pre-wrap;
    word-break: break-word; -webkit-overflow-scrolling: touch; }
  #answer.err { color: #ff6961; }
  .wait { color: #8e8e93; display: flex; align-items: center; gap: 10px; }
  .spin { width: 18px; height: 18px; border: 3px solid #48484a; border-top-color: #0a84ff;
    border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  #close { flex: none; height: 56px; border: 0; border-radius: 14px; background: #3a3a3c;
    color: #fff; font-size: 18px; font-weight: 600; margin-bottom: 12px; }

  /* 設定画面 */
  #setup { justify-content: center; gap: 14px; }
  #setup h2 { margin: 0 0 4px; font-size: 20px; }
  #setup p { margin: 0; color: #8e8e93; font-size: 14px; line-height: 1.6; }
  #key { height: 50px; border-radius: 12px; border: 1px solid #48484a; background: #2c2c2e;
    color: #fff; padding: 0 14px; font-size: 16px; }
  #save { height: 52px; border: 0; border-radius: 12px; background: #0a84ff; color: #fff;
    font-size: 17px; font-weight: 600; }
  #file { display: none; }
</style>
</head>
<body>

<section id="home" class="screen">
  <button id="gear">設定</button>
  <button id="shoot">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>
    撮影
  </button>
  <input id="file" type="file" accept="image/*" capture="environment">
</section>

<section id="result" class="screen">
  <img id="thumb" alt="">
  <div id="answer"></div>
  <button id="close">閉じる</button>
</section>

<section id="setup" class="screen">
  <h2>APIキーの設定</h2>
  <p>Anthropic の API キー（sk-ant-…）を入力してください。キーはこの iPhone の中だけに保存され、Anthropic 以外には送られません。</p>
  <input id="key" type="password" placeholder="sk-ant-..." autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="save">保存</button>
</section>

<script type="module">
import Anthropic from "https://esm.sh/@anthropic-ai/sdk";

const $ = (id) => document.getElementById(id);
const KEY = "anthropic_api_key";
const SYSTEM = `あなたは写真に写った問題を解くアシスタントです。
写真の問題を読み取り、解いて、日本語で答えてください。
- 最初の行に「答え：」として最終的な答えを簡潔に書く。
- 空行のあと、解き方を短く順を追って説明する。
- 問題が複数あれば、番号ごとに同じ形式で答える。
- iPhone の画面でそのまま読むので、Markdown 記号や LaTeX は使わず、普通の文字（×, ÷, √, ², 分数は 3/4 など）で書く。
- 写真が読み取れない・問題が写っていない場合は、そう伝えて撮り直しをお願いする。`;

let busy = null; // 進行中のストリーム

function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));
}

function start() {
  show(localStorage.getItem(KEY) ? "home" : "setup");
}

$("gear").onclick = () => { $("key").value = localStorage.getItem(KEY) || ""; show("setup"); };
$("save").onclick = () => {
  const v = $("key").value.trim();
  if (!v) return;
  localStorage.setItem(KEY, v);
  show("home");
};

$("shoot").onclick = () => $("file").click();
$("file").onchange = async (e) => {
  const f = e.target.files[0];
  e.target.value = "";
  if (f) solve(f);
};

$("close").onclick = () => {
  if (busy) { busy.abort(); busy = null; }
  $("thumb").removeAttribute("src");
  $("answer").textContent = "";
  show("home");
};

// 写真を長辺 1568px の JPEG に縮小して base64 で返す
async function toJpeg(file) {
  const img = await createImageBitmap(file);
  const scale = Math.min(1, 1568 / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * scale);
  c.height = Math.round(img.height * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const url = c.toDataURL("image/jpeg", 0.85);
  return { url, data: url.split(",")[1] };
}

async function solve(file) {
  const ans = $("answer");
  ans.className = "";
  ans.innerHTML = '<div class="wait"><div class="spin"></div>解いています…</div>';
  show("result");

  try {
    const { url, data } = await toJpeg(file);
    $("thumb").src = url;

    const client = new Anthropic({
      apiKey: localStorage.getItem(KEY),
      dangerouslyAllowBrowser: true,
    });

    const stream = client.beta.messages.stream({
      model: "claude-opus-5-5",
      max_tokens: 16000,
      betas: ["server-side-fallback-2026-07-01"],
      fallbacks: "default",
      output_config: { effort: "medium" },
      system: SYSTEM,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: "image/jpeg", data } },
          { type: "text", text: "この問題を解いてください。" },
        ],
      }],
    });
    busy = stream;

    let first = true;
    stream.on("text", (t) => {
      if (first) { ans.textContent = ""; first = false; }
      ans.textContent += t;
    });

    const msg = await stream.finalMessage();
    busy = null;
    if (msg.stop_reason === "refusal") {
      ans.className = "err";
      ans.textContent = "この内容には回答できませんでした。";
    } else if (first) {
      ans.textContent = "答えを取得できませんでした。撮り直してください。";
    }
  } catch (err) {
    busy = null;
    if (err instanceof Anthropic.APIUserAbortError) return;
    ans.className = "err";
    if (err instanceof Anthropic.AuthenticationError) {
      ans.textContent = "API キーが正しくありません。右上の「設定」から入れ直してください。";
    } else if (err instanceof Anthropic.RateLimitError) {
      ans.textContent = "混み合っています。少し待ってからもう一度お試しください。";
    } else if (err instanceof Anthropic.APIConnectionError) {
      ans.textContent = "通信できませんでした。電波を確認してください。";
    } else {
      ans.textContent = "エラー: " + (err.message || err);
    }
  }
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
start();
</script>
</body>
</html>
